server {
    listen 80;
    server_name _;

    # Docker's embedded DNS — lets nginx resolve upstream hostnames
    # at request time instead of at startup, so this container does not
    # crash-loop if the backend is not yet reachable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service.
    # When proxy_pass uses a variable nginx does not rewrite the URI,
    # so we keep the full /api/* path by passing $request_uri as-is —
    # do NOT append a path to the proxy_pass URL.
    location /api/ {
        set $upstream_backend backend:3000;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
