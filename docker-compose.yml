services:
  db:
    image: postgres:16-alpine
    container_name: coaching-db
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: coaching-backend
    environment:
      DATABASE_URL: postgresql://coaching:coaching@db:5432/coaching_db
      JWT_SECRET: dev_secret_change_me
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: coaching-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
